name: verify

on:
  push:
  pull_request:

jobs:
  public-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  ai-dialogue:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PalAgentDialogue
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
